<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Рабочий календарь</title>
  <style>
    :root {
      --bg-top: #e8f1f8;
      --bg-bottom: #f5f9fc;
      --accent: #3b82f6;
      --accent-soft: rgba(59, 130, 246, 0.15);
      --card-bg: rgba(255, 255, 255, 0.86);
      --text-main: #0f172a;
      --text-muted: #64748b;

      /* Динамические цвета статусов (перезаписываются палитрой) */
      --work-bg: #dbeafe;
      --work-text: #1e40af;
      --off-bg: #f1f5f9;
      --off-text: #475569;
      --vacation-bg: #fef3c7;
      --vacation-text: #92400e;
      --dayoff-bg: #ede9fe;
      --dayoff-text: #5b21b6;
      --sick-bg: #ffe4e6;
      --sick-text: #9f1239;
      --extra-bg: #dcfce7;
      --extra-text: #166534;
    }

    body.season-winter {
      --bg-top: #d8ecfa;
      --bg-bottom: #f2f8fd;
      --accent: #2563eb;
      --accent-soft: rgba(37, 99, 235, 0.15);
    }
    body.season-spring {
      --bg-top: #dcf4e6;
      --bg-bottom: #f6fbf8;
      --accent: #059669;
      --accent-soft: rgba(5, 150, 105, 0.15);
    }
    body.season-summer {
      --bg-top: #fef0c7;
      --bg-bottom: #fffdf5;
      --accent: #d97706;
      --accent-soft: rgba(217, 119, 6, 0.16);
    }
    body.season-autumn {
      --bg-top: #ffedd5;
      --bg-bottom: #fdf8f3;
      --accent: #ea580c;
      --accent-soft: rgba(234, 88, 12, 0.15);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
      color: var(--text-main);
      min-height: 100dvh;
      overflow-x: hidden;
      transition: background 0.5s ease;
      padding-top: max(env(safe-area-inset-top, 12px), 12px);
      padding-bottom: max(env(safe-area-inset-bottom, 14px), 14px);
      display: flex;
      flex-direction: column;
    }

    #weatherCanvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    .app-container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
      padding: 8px 10px;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 10px;
    }

    /* Компактная верхняя шапка */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      padding: 4px 6px;
    }
    .title-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .badges-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .season-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      font-weight: 700;
      color: var(--accent);
      background: var(--card-bg);
      padding: 4px 10px;
      border-radius: 999px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.04);
    }
    .schedule-pill {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      background: rgba(255,255,255,0.65);
      padding: 4px 9px;
      border-radius: 999px;
    }
    .month-title {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.6px;
      line-height: 1.1;
    }

    /* Мини-статистика в шапке */
    .mini-stats {
      display: flex;
      gap: 6px;
    }
    .mini-stat {
      background: var(--card-bg);
      padding: 5px 8px;
      border-radius: 10px;
      text-align: center;
      min-width: 44px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.03);
    }
    .mini-stat b {
      display: block;
      font-size: 14px;
      font-weight: 800;
    }
    .mini-stat span {
      font-size: 9px;
      color: var(--text-muted);
      font-weight: 600;
    }

    /* Карточка календаря (крупная) */
    .calendar-card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,0.8);
      border-radius: 24px;
      padding: 12px 8px;
      box-shadow: 0 10px 28px rgba(15, 23, 42, 0.06);
      touch-action: pan-y;
      transition: transform 0.18s ease, opacity 0.18s ease;
    }

    .weekdays {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      text-align: center;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 8px;
      padding: 0 2px;
    }

    .days-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 5px;
    }

    .day-cell {
      width: 100%;
      min-height: 58px;
      aspect-ratio: 1 / 1.18;
      border-radius: 14px;
      background: rgba(255,255,255,0.55);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 6px 2px 5px;
      cursor: pointer;
      position: relative;
      border: 2px solid transparent;
      overflow: hidden;
      transition: transform 0.1s ease, background 0.15s ease;
    }
    .day-cell:active {
      transform: scale(0.92);
    }
    .day-cell.empty {
      background: transparent;
      pointer-events: none;
    }
    .day-cell.today {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--accent-soft);
    }
    .day-num {
      font-size: 16px;
      font-weight: 800;
      line-height: 1.1;
    }
    .day-tag {
      font-size: 9px;
      font-weight: 700;
      padding: 1px 3px;
      border-radius: 5px;
      width: 94%;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .reminder-dots {
      display: flex;
      gap: 3px;
      height: 5px;
      align-items: center;
    }
    .dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: currentColor;
      opacity: 0.85;
    }

    /* Статусы ячеек */
    .day-cell.st-work { background: var(--work-bg); color: var(--work-text); }
    .day-cell.st-off { background: var(--off-bg); color: var(--off-text); }
    .day-cell.st-vacation { background: var(--vacation-bg); color: var(--vacation-text); }
    .day-cell.st-dayoff { background: var(--dayoff-bg); color: var(--dayoff-text); }
    .day-cell.st-sick { background: var(--sick-bg); color: var(--sick-text); }
    .day-cell.st-extra { background: var(--extra-bg); color: var(--extra-text); }

    .swipe-hint {
      text-align: center;
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 8px;
      opacity: 0.75;
    }

    /* Нижняя зона управления (под палец) */
    .bottom-controls {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* Панель быстрой кисти */
    .tools-card {
      background: var(--card-bg);
      backdrop-filter: blur(14px);
      border-radius: 18px;
      padding: 8px 10px;
      border: 1px solid rgba(255,255,255,0.7);
    }
    .tools-scroll {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .tools-scroll::-webkit-scrollbar { display: none; }

    .tool-chip {
      flex-shrink: 0;
      border: 1.5px solid transparent;
      background: rgba(255,255,255,0.8);
      color: var(--text-main);
      padding: 8px 11px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .tool-chip.active {
      border-color: var(--accent);
      background: var(--accent-soft);
      color: var(--accent);
    }

    /* Навигация и меню снизу */
    .bottom-nav {
      display: grid;
      grid-template-columns: 1fr 1.1fr 1fr 1.1fr;
      gap: 8px;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      padding: 8px;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.8);
      box-shadow: 0 6px 20px rgba(15, 23, 42, 0.06);
    }
    .nav-btn {
      height: 44px;
      border-radius: 14px;
      border: none;
      background: rgba(255,255,255,0.85);
      color: var(--text-main);
      font-size: 13px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.03);
    }
    .nav-btn:active {
      transform: scale(0.95);
    }
    .nav-btn.primary-nav {
      background: var(--accent);
      color: #fff;
    }

    /* Модальные шторки */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.45);
      backdrop-filter: blur(4px);
      display: none;
      align-items: flex-end;
      justify-content: center;
      z-index: 100;
    }
    .modal-backdrop.open {
      display: flex;
    }
    .modal-sheet {
      background: #ffffff;
      width: 100%;
      max-width: 480px;
      border-radius: 26px 26px 0 0;
      padding: 12px 18px 28px;
      max-height: 84dvh;
      overflow-y: auto;
      animation: slideUp 0.2s ease-out;
    }
    .sheet-handle {
      width: 42px;
      height: 5px;
      background: #cbd5e1;
      border-radius: 999px;
      margin: 0 auto 12px;
    }
    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }
    .modal-title {
      font-size: 18px;
      font-weight: 800;
    }
    .close-btn {
      background: #f1f5f9;
      border: none;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      font-size: 16px;
      cursor: pointer;
    }

    .form-group {
      margin-bottom: 12px;
    }
    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 5px;
    }
    .input, select {
      width: 100%;
      padding: 11px 12px;
      border-radius: 12px;
      border: 1px solid #cbd5e1;
      font-size: 14px;
      background: #f8fafc;
      color: var(--text-main);
    }
    .time-range {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .btn-primary {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 14px;
      padding: 12px 16px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
    }
    .btn-primary:active {
      transform: scale(0.98);
    }

    /* Список действий в меню */
    .menu-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .menu-item-btn {
      width: 100%;
      padding: 14px 16px;
      border-radius: 16px;
      border: 1px solid #e2e8f0;
      background: #f8fafc;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 15px;
      font-weight: 700;
      color: var(--text-main);
      cursor: pointer;
    }
    .menu-item-btn:active {
      background: #f1f5f9;
    }

    /* Палитра цветов */
    .color-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 12px;
      background: #f8fafc;
      border-radius: 14px;
      margin-bottom: 8px;
    }
    .color-row span {
      font-size: 14px;
      font-weight: 700;
    }
    .color-picker-input {
      width: 44px;
      height: 36px;
      border: none;
      border-radius: 8px;
      background: none;
      cursor: pointer;
    }

    .reminder-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin: 10px 0 14px;
    }
    .reminder-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #f8fafc;
      padding: 10px 12px;
      border-radius: 12px;
      border-left: 4px solid var(--accent);
    }
    .reminder-time {
      font-size: 12px;
      font-weight: 700;
      color: var(--accent);
    }
    .reminder-text {
      font-size: 14px;
      font-weight: 500;
    }
    .del-btn {
      background: none;
      border: none;
      color: #ef4444;
      font-size: 16px;
      cursor: pointer;
      padding: 4px;
    }
  </style>
</head>
<body class="season-winter">
  <canvas id="weatherCanvas"></canvas>

  <div class="app-container">
    <!-- Верхняя шапка со сводкой -->
    <div class="top-bar">
      <div class="title-group">
        <div class="badges-row">
          <div class="season-badge" id="seasonBadge">❄️ Зима</div>
          <div class="schedule-pill" id="activeScheduleText">2/2</div>
        </div>
        <div class="month-title" id="monthTitle">Ноябрь 2026</div>
      </div>

      <div class="mini-stats">
        <div class="mini-stat">
          <b id="statWork">0</b>
          <span>Смен</span>
        </div>
        <div class="mini-stat">
          <b id="statOff">0</b>
          <span>Вых</span>
        </div>
        <div class="mini-stat">
          <b id="statVac">0</b>
          <span>Отп</span>
        </div>
      </div>
    </div>

    <!-- Крупный календарь с поддержкой свайпов -->
    <div class="calendar-card" id="calendarSwipeArea">
      <div class="weekdays">
        <div>Пн</div><div>Вт</div><div>Ср</div><div>Чт</div><div>Пт</div><div>Сб</div><div>Вс</div>
      </div>
      <div class="days-grid" id="daysGrid"></div>
      <div class="swipe-hint">← Свайп влево/вправо для смены месяца →</div>
    </div>

    <!-- Нижняя панель управления под палец -->
    <div class="bottom-controls">
      <!-- Режим быстрого выделения -->
      <div class="tools-card">
        <div class="tools-scroll" id="toolsBar">
          <button class="tool-chip active" data-tool="inspect">📅 План дня</button>
          <button class="tool-chip" data-tool="vacation">🏖️ Отпуск</button>
          <button class="tool-chip" data-tool="dayoff">⚡ Отгул</button>
          <button class="tool-chip" data-tool="sick">💊 Больн.</button>
          <button class="tool-chip" data-tool="extra">🔥 Доп. смена</button>
          <button class="tool-chip" data-tool="clear">🧹 Сброс</button>
        </div>
      </div>

      <!-- Кнопки переключения месяцев и Меню снизу -->
      <div class="bottom-nav">
        <button class="nav-btn" id="prevMonthBtn">◀ Пред</button>
        <button class="nav-btn" id="todayBtn">● Сегодня</button>
        <button class="nav-btn" id="nextMonthBtn">След ▶</button>
        <button class="nav-btn primary-nav" id="openMenuBtn">⚙️ Меню</button>
      </div>
    </div>
  </div>

  <!-- Главное меню (скрытые функции) -->
  <div class="modal-backdrop" id="menuModal">
    <div class="modal-sheet">
      <div class="sheet-handle"></div>
      <div class="modal-header">
        <div class="modal-title">Настройки и функции</div>
        <button class="close-btn" onclick="closeModal('menuModal')">✕</button>
      </div>
      <div class="menu-list">
        <button class="menu-item-btn" id="menuScheduleBtn">
          <span>🗓️ Изменить график смен</span>
          <span>›</span>
        </button>
        <button class="menu-item-btn" id="menuVacationBtn">
          <span>🏖️ Выбрать отпуск датами (от–до)</span>
          <span>›</span>
        </button>
        <button class="menu-item-btn" id="menuColorsBtn">
          <span>🎨 Своя палитра цветов</span>
          <span>›</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Модалка дня и напоминаний -->
  <div class="modal-backdrop" id="dayModal">
    <div class="modal-sheet">
      <div class="sheet-handle"></div>
      <div class="modal-header">
        <div class="modal-title" id="dayModalTitle">15 ноября</div>
        <button class="close-btn" onclick="closeModal('dayModal')">✕</button>
      </div>

      <div class="form-group">
        <label>Статус дня (поверх графика)</label>
        <select id="dayStatusSelect">
          <option value="auto">По графику (Авто)</option>
          <option value="work">💼 Рабочая смена</option>
          <option value="off">🏠 Выходной</option>
          <option value="vacation">🏖️ Отпуск</option>
          <option value="dayoff">⚡ Отгул</option>
          <option value="sick">💊 Больничный</option>
          <option value="extra">🔥 Доп. смена</option>
        </select>
      </div>

      <hr style="border:none;border-top:1px solid #e2e8f0;margin:12px 0;" />

      <label style="font-size:12px;font-weight:700;color:var(--text-muted);">Напоминания по времени</label>
      <div class="reminder-list" id="reminderList"></div>

      <div class="form-group">
        <label>Диапазон времени</label>
        <div class="time-range">
          <input type="time" class="input" id="remStart" value="09:00" />
          <input type="time" class="input" id="remEnd" value="18:00" />
        </div>
      </div>
      <div class="form-group">
        <label>Описание</label>
        <input type="text" class="input" id="remText" placeholder="Например: Смена / Дежурство / Врач" />
      </div>
      <button class="btn-primary" id="addReminderBtn">+ Добавить напоминание</button>
    </div>
  </div>

  <!-- Модалка настройки графика -->
  <div class="modal-backdrop" id="scheduleModal">
    <div class="modal-sheet">
      <div class="sheet-handle"></div>
      <div class="modal-header">
        <div class="modal-title">Настройка графика</div>
        <button class="close-btn" onclick="closeModal('scheduleModal')">✕</button>
      </div>
      <div class="form-group">
        <label>Схема работы</label>
        <select id="schedulePreset">
          <option value="2-2">2/2 (2 рабочих / 2 выходных)</option>
          <option value="5-2">5/2 (5 рабочих / 2 выходных)</option>
          <option value="1-3">1/3 (Сутки через трое)</option>
          <option value="3-3">3/3 (3 рабочих / 3 выходных)</option>
          <option value="4-2">4/2 (4 рабочих / 2 выходных)</option>
          <option value="0-0">Без авто-графика</option>
        </select>
      </div>
      <div class="form-group">
        <label>Дата первой рабочей смены</label>
        <input type="date" class="input" id="scheduleStartDate" />
      </div>
      <button class="btn-primary" id="saveScheduleBtn">Сохранить график</button>
    </div>
  </div>

  <!-- Модалка выбора отпуска диапазоном -->
  <div class="modal-backdrop" id="vacationModal">
    <div class="modal-sheet">
      <div class="sheet-handle"></div>
      <div class="modal-header">
        <div class="modal-title">🏖️ Период отпуска</div>
        <button class="close-btn" onclick="closeModal('vacationModal')">✕</button>
      </div>
      <div class="form-group">
        <label>Начало отпуска</label>
        <input type="date" class="input" id="vacStart" />
      </div>
      <div class="form-group">
        <label>Конец отпуска (включительно)</label>
        <input type="date" class="input" id="vacEnd" />
      </div>
      <button class="btn-primary" id="saveVacationRangeBtn">Выделить дни отпуска</button>
    </div>
  </div>

  <!-- Модалка выбора своих цветов (Палитра) -->
  <div class="modal-backdrop" id="colorsModal">
    <div class="modal-sheet">
      <div class="sheet-handle"></div>
      <div class="modal-header">
        <div class="modal-title">🎨 Палитра цветов</div>
        <button class="close-btn" onclick="closeModal('colorsModal')">✕</button>
      </div>

      <div class="color-row">
        <span>💼 Рабочая смена</span>
        <input type="color" class="color-picker-input" id="colWork" />
      </div>
      <div class="color-row">
        <span>🏠 Выходной день</span>
        <input type="color" class="color-picker-input" id="colOff" />
      </div>
      <div class="color-row">
        <span>🏖️ Отпуск</span>
        <input type="color" class="color-picker-input" id="colVacation" />
      </div>
      <div class="color-row">
        <span>⚡ Отгул</span>
        <input type="color" class="color-picker-input" id="colDayoff" />
      </div>
      <div class="color-row">
        <span>💊 Больничный</span>
        <input type="color" class="color-picker-input" id="colSick" />
      </div>
      <div class="color-row">
        <span>🔥 Доп. смена</span>
        <input type="color" class="color-picker-input" id="colExtra" />
      </div>

      <div style="display:flex;gap:8px;margin-top:14px;">
        <button class="btn-primary" style="background:#64748b;" id="resetColorsBtn">Сбросить</button>
        <button class="btn-primary" id="saveColorsBtn">Применить</button>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'work_calendar_state_v2';

    const DEFAULT_COLORS = {
      work: '#dbeafe',
      off: '#f1f5f9',
      vacation: '#fef3c7',
      dayoff: '#ede9fe',
      sick: '#ffe4e6',
      extra: '#dcfce7'
    };

    const today = new Date();
    let currentYear = today.getFullYear();
    let currentMonth = today.getMonth();
    let activeTool = 'inspect';
    let selectedDateKey = null;

    let state = {
      schedule: {
        workDays: 2,
        offDays: 2,
        startDate: formatDateKey(today)
      },
      overrides: {},
      reminders: {},
      colors: { ...DEFAULT_COLORS }
    };

    function loadState() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY) || localStorage.getItem('work_calendar_state_v1');
        if (saved) {
          const parsed = JSON.parse(saved);
          state = {
            ...state,
            ...parsed,
            colors: { ...DEFAULT_COLORS, ...(parsed.colors || {}) }
          };
        }
      } catch (e) {}
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    // Автоматический расчёт тёмного контрастного текста под любой цвет из палитры
    function getContrastText(hex) {
      const clean = hex.replace('#', '');
      const r = parseInt(clean.substring(0, 2), 16);
      const g = parseInt(clean.substring(2, 4), 16);
      const b = parseInt(clean.substring(4, 6), 16);
      const luminance = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
      if (luminance < 0.52) return '#ffffff';
      const dr = Math.max(0, Math.floor(r * 0.32));
      const dg = Math.max(0, Math.floor(g * 0.32));
      const db = Math.max(0, Math.floor(b * 0.32));
      return `rgb(${dr}, ${dg}, ${db})`;
    }

    function applyCustomColors() {
      const root = document.documentElement;
      const c = state.colors || DEFAULT_COLORS;
      Object.keys(DEFAULT_COLORS).forEach(key => {
        const bg = c[key] || DEFAULT_COLORS[key];
        root.style.setProperty(`--${key}-bg`, bg);
        root.style.setProperty(`--${key}-text`, getContrastText(bg));
      });
    }

    function formatDateKey(dateObj) {
      const y = dateObj.getFullYear();
      const m = String(dateObj.getMonth() + 1).padStart(2, '0');
      const d = String(dateObj.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function parseDateKey(key) {
      const [y, m, d] = key.split('-').map(Number);
      return new Date(y, m - 1, d);
    }

    function getBaseShiftStatus(dateKey) {
      const { workDays, offDays, startDate } = state.schedule;
      if (!workDays || !offDays || !startDate) return 'none';
      const cycle = workDays + offDays;
      const target = parseDateKey(dateKey);
      const start = parseDateKey(startDate);
      const diffDays = Math.round((target - start) / (1000 * 60 * 60 * 24));
      const mod = ((diffDays % cycle) + cycle) % cycle;
      return mod < workDays ? 'work' : 'off';
    }

    function getDayStatus(dateKey) {
      if (state.overrides[dateKey]) return state.overrides[dateKey];
      return getBaseShiftStatus(dateKey);
    }

    const STATUS_LABELS = {
      work: 'Смена',
      off: 'Вых',
      vacation: 'Отпуск',
      dayoff: 'Отгул',
      sick: 'Больн.',
      extra: 'Доп.',
      none: ''
    };

    const MONTHS_RU = [
      'Январь', 'Февраль', 'Март', 'Апрель', 'Май', 'Июнь',
      'Июль', 'Август', 'Сентябрь', 'Октябрь', 'Ноябрь', 'Декабрь'
    ];

    function updateSeasonTheme(month) {
      document.body.classList.remove('season-winter', 'season-spring', 'season-summer', 'season-autumn');
      const badge = document.getElementById('seasonBadge');
      if (month === 11 || month === 0 || month === 1) {
        document.body.classList.add('season-winter');
        badge.textContent = '❄️ Зима';
        currentSeason = 'winter';
      } else if (month >= 2 && month <= 4) {
        document.body.classList.add('season-spring');
        badge.textContent = '🌸 Весна';
        currentSeason = 'spring';
      } else if (month >= 5 && month <= 7) {
        document.body.classList.add('season-summer');
        badge.textContent = '☀️ Лето';
        currentSeason = 'summer';
      } else {
        document.body.classList.add('season-autumn');
        badge.textContent = '🍂 Осень';
        currentSeason = 'autumn';
      }
    }

    function renderCalendar() {
      updateSeasonTheme(currentMonth);
      document.getElementById('monthTitle').textContent = `${MONTHS_RU[currentMonth]} ${currentYear}`;

      const { workDays, offDays } = state.schedule;
      document.getElementById('activeScheduleText').textContent =
        workDays > 0 ? `График ${workDays}/${offDays}` : 'Без графика';

      const grid = document.getElementById('daysGrid');
      grid.innerHTML = '';

      const firstDay = new Date(currentYear, currentMonth, 1);
      const startWeekday = (firstDay.getDay() + 6) % 7;
      const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
      const todayKey = formatDateKey(new Date());

      let countWork = 0, countOff = 0, countVac = 0;

      for (let i = 0; i < startWeekday; i++) {
        const empty = document.createElement('div');
        empty.className = 'day-cell empty';
        grid.appendChild(empty);
      }

      for (let d = 1; d <= daysInMonth; d++) {
        const dateKey = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
        const status = getDayStatus(dateKey);

        if (status === 'work' || status === 'extra') countWork++;
        else if (status === 'off') countOff++;
        else if (status === 'vacation') countVac++;

        const cell = document.createElement('div');
        cell.className = `day-cell st-${status}`;
        if (dateKey === todayKey) cell.classList.add('today');

        const num = document.createElement('div');
        num.className = 'day-num';
        num.textContent = d;

        const tag = document.createElement('div');
        tag.className = 'day-tag';
        tag.textContent = STATUS_LABELS[status] || '';

        const dots = document.createElement('div');
        dots.className = 'reminder-dots';
        const rems = state.reminders[dateKey] || [];
        rems.slice(0, 3).forEach(() => {
          const dot = document.createElement('span');
          dot.className = 'dot';
          dots.appendChild(dot);
        });

        cell.appendChild(num);
        cell.appendChild(tag);
        cell.appendChild(dots);

        cell.addEventListener('click', () => handleDayClick(dateKey));
        grid.appendChild(cell);
      }

      document.getElementById('statWork').textContent = countWork;
      document.getElementById('statOff').textContent = countOff;
      document.getElementById('statVac').textContent = countVac;
    }

    function changeMonth(delta) {
      const card = document.getElementById('calendarSwipeArea');
      card.style.transform = `translateX(${delta > 0 ? '-14px' : '14px'})`;
      card.style.opacity = '0.6';
      setTimeout(() => {
        currentMonth += delta;
        if (currentMonth < 0) { currentMonth = 11; currentYear--; }
        if (currentMonth > 11) { currentMonth = 0; currentYear++; }
        renderCalendar();
        card.style.transform = 'translateX(0)';
        card.style.opacity = '1';
      }, 110);
    }

    // Свайп влево/вправо по календарю
    let touchStartX = 0;
    let touchStartY = 0;
    const swipeArea = document.getElementById('calendarSwipeArea');

    swipeArea.addEventListener('touchstart', (e) => {
      touchStartX = e.changedTouches[0].clientX;
      touchStartY = e.changedTouches[0].clientY;
    }, { passive: true });

    swipeArea.addEventListener('touchend', (e) => {
      const dx = e.changedTouches[0].clientX - touchStartX;
      const dy = e.changedTouches[0].clientY - touchStartY;
      if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.4) {
        if (dx < 0) changeMonth(1);
        else changeMonth(-1);
      }
    }, { passive: true });

    function handleDayClick(dateKey) {
      if (activeTool === 'inspect') {
        openDayModal(dateKey);
      } else if (activeTool === 'clear') {
        delete state.overrides[dateKey];
        saveState();
        renderCalendar();
      } else {
        if (state.overrides[dateKey] === activeTool) {
          delete state.overrides[dateKey];
        } else {
          state.overrides[dateKey] = activeTool;
        }
        saveState();
        renderCalendar();
      }
    }

    function openDayModal(dateKey) {
      selectedDateKey = dateKey;
      const [y, m, d] = dateKey.split('-').map(Number);
      document.getElementById('dayModalTitle').textContent = `${d} ${MONTHS_RU[m - 1]} ${y}`;
      document.getElementById('dayStatusSelect').value = state.overrides[dateKey] || 'auto';
      renderRemindersList();
      document.getElementById('dayModal').classList.add('open');
    }

    function closeModal(id) {
      document.getElementById(id).classList.remove('open');
    }

    // Закрытие любого модального окна по тапу на пустое пространство выше шторки
    document.querySelectorAll('.modal-backdrop').forEach(backdrop => {
      backdrop.addEventListener('click', (e) => {
        if (e.target === backdrop) {
          backdrop.classList.remove('open');
        }
      });
    });

    function renderRemindersList() {
      const list = document.getElementById('reminderList');
      list.innerHTML = '';
      const items = state.reminders[selectedDateKey] || [];
      if (items.length === 0) {
        list.innerHTML = '<div style="font-size:13px;color:var(--text-muted);">На этот день напоминаний нет</div>';
        return;
      }
      items.forEach((item, idx) => {
        const row = document.createElement('div');
        row.className = 'reminder-item';
        row.innerHTML = `
          <div>
            <div class="reminder-time">${item.start} – ${item.end}</div>
            <div class="reminder-text">${item.text}</div>
          </div>
          <button class="del-btn" onclick="deleteReminder(${idx})">✕</button>
        `;
        list.appendChild(row);
      });
    }

    window.deleteReminder = function(idx) {
      if (!selectedDateKey || !state.reminders[selectedDateKey]) return;
      state.reminders[selectedDateKey].splice(idx, 1);
      if (state.reminders[selectedDateKey].length === 0) delete state.reminders[selectedDateKey];
      saveState();
      renderRemindersList();
      renderCalendar();
    };

    document.getElementById('addReminderBtn').addEventListener('click', () => {
      const start = document.getElementById('remStart').value;
      const end = document.getElementById('remEnd').value;
      const text = document.getElementById('remText').value.trim();
      if (!text) return;
      if (!state.reminders[selectedDateKey]) state.reminders[selectedDateKey] = [];
      state.reminders[selectedDateKey].push({ start, end, text });
      document.getElementById('remText').value = '';
      saveState();
      renderRemindersList();
      renderCalendar();
    });

    document.getElementById('dayStatusSelect').addEventListener('change', (e) => {
      const val = e.target.value;
      if (val === 'auto') delete state.overrides[selectedDateKey];
      else state.overrides[selectedDateKey] = val;
      saveState();
      renderCalendar();
    });

    // Переключение быстрых инструментов
    document.querySelectorAll('#toolsBar .tool-chip').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#toolsBar .tool-chip').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        activeTool = btn.dataset.tool;
      });
    });

    // Кнопки нижней навигации
    document.getElementById('prevMonthBtn').addEventListener('click', () => changeMonth(-1));
    document.getElementById('nextMonthBtn').addEventListener('click', () => changeMonth(1));
    document.getElementById('todayBtn').addEventListener('click', () => {
      const now = new Date();
      currentYear = now.getFullYear();
      currentMonth = now.getMonth();
      renderCalendar();
    });

    // Открытие меню и его пунктов
    document.getElementById('openMenuBtn').addEventListener('click', () => {
      document.getElementById('menuModal').classList.add('open');
    });

    document.getElementById('menuScheduleBtn').addEventListener('click', () => {
      closeModal('menuModal');
      document.getElementById('scheduleStartDate').value = state.schedule.startDate;
      document.getElementById('scheduleModal').classList.add('open');
    });

    document.getElementById('menuVacationBtn').addEventListener('click', () => {
      closeModal('menuModal');
      const base = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-01`;
      document.getElementById('vacStart').value = base;
      document.getElementById('vacEnd').value = base;
      document.getElementById('vacationModal').classList.add('open');
    });

    document.getElementById('menuColorsBtn').addEventListener('click', () => {
      closeModal('menuModal');
      document.getElementById('colWork').value = state.colors.work;
      document.getElementById('colOff').value = state.colors.off;
      document.getElementById('colVacation').value = state.colors.vacation;
      document.getElementById('colDayoff').value = state.colors.dayoff;
      document.getElementById('colSick').value = state.colors.sick;
      document.getElementById('colExtra').value = state.colors.extra;
      document.getElementById('colorsModal').classList.add('open');
    });

    document.getElementById('saveScheduleBtn').addEventListener('click', () => {
      const [w, o] = document.getElementById('schedulePreset').value.split('-').map(Number);
      const startDate = document.getElementById('scheduleStartDate').value || formatDateKey(new Date());
      state.schedule = { workDays: w, offDays: o, startDate };
      saveState();
      closeModal('scheduleModal');
      renderCalendar();
    });

    document.getElementById('saveVacationRangeBtn').addEventListener('click', () => {
      const s = parseDateKey(document.getElementById('vacStart').value);
      const e = parseDateKey(document.getElementById('vacEnd').value);
      if (s && e && s <= e) {
        let cur = new Date(s);
        while (cur <= e) {
          state.overrides[formatDateKey(cur)] = 'vacation';
          cur.setDate(cur.getDate() + 1);
        }
        saveState();
        renderCalendar();
      }
      closeModal('vacationModal');
    });

    document.getElementById('saveColorsBtn').addEventListener('click', () => {
      state.colors = {
        work: document.getElementById('colWork').value,
        off: document.getElementById('colOff').value,
        vacation: document.getElementById('colVacation').value,
        dayoff: document.getElementById('colDayoff').value,
        sick: document.getElementById('colSick').value,
        extra: document.getElementById('colExtra').value
      };
      applyCustomColors();
      saveState();
      closeModal('colorsModal');
      renderCalendar();
    });

    document.getElementById('resetColorsBtn').addEventListener('click', () => {
      state.colors = { ...DEFAULT_COLORS };
      applyCustomColors();
      saveState();
      closeModal('colorsModal');
      renderCalendar();
    });

    // Фоновая погодная анимация
    const canvas = document.getElementById('weatherCanvas');
    const ctx = canvas.getContext('2d');
    let currentSeason = 'winter';
    let particles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    for (let i = 0; i < 26; i++) {
      particles.push({
        x: Math.random() * window.innerWidth,
        y: Math.random() * window.innerHeight,
        r: 2 + Math.random() * 4,
        speedY: 0.4 + Math.random() * 0.8,
        speedX: (Math.random() - 0.5) * 0.5,
        angle: Math.random() * Math.PI * 2
      });
    }

    function animateWeather() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (currentSeason === 'summer') {
        const grad = ctx.createRadialGradient(canvas.width * 0.85, 40, 10, canvas.width * 0.85, 40, 220);
        grad.addColorStop(0, 'rgba(251, 191, 36, 0.25)');
        grad.addColorStop(1, 'rgba(251, 191, 36, 0)');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }

      particles.forEach(p => {
        p.y += p.speedY;
        p.x += p.speedX + Math.sin(p.angle) * 0.3;
        p.angle += 0.02;

        if (p.y > canvas.height + 10) { p.y = -10; p.x = Math.random() * canvas.width; }

        ctx.save();
        ctx.translate(p.x, p.y);
        if (currentSeason === 'winter') {
          ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
          ctx.beginPath();
          ctx.arc(0, 0, p.r, 0, Math.PI * 2);
          ctx.fill();
        } else if (currentSeason === 'spring') {
          ctx.fillStyle = 'rgba(244, 114, 182, 0.42)';
          ctx.rotate(p.angle);
          ctx.beginPath();
          ctx.ellipse(0, 0, p.r * 1.3, p.r * 0.8, 0, 0, Math.PI * 2);
          ctx.fill();
        } else if (currentSeason === 'autumn') {
          ctx.fillStyle = 'rgba(234, 88, 12, 0.36)';
          ctx.rotate(p.angle);
          ctx.beginPath();
          ctx.ellipse(0, 0, p.r * 1.5, p.r * 0.9, 0, 0, Math.PI * 2);
          ctx.fill();
        } else if (currentSeason === 'summer') {
          ctx.fillStyle = 'rgba(251, 191, 36, 0.2)';
          ctx.beginPath();
          ctx.arc(0, 0, p.r * 1.4, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      });

      requestAnimationFrame(animateWeather);
    }

    loadState();
    applyCustomColors();
    renderCalendar();
    animateWeather();
  </script>
</body>
</html>
